<script>
const $=s=>document.querySelector(s);
const Q=(q,a,correct,why)=>({q,a,correct,why});
const bank={
anatomy:{label:'Anatomy',icon:'🦴',note:'Structure, nerves, vessels, embryology',list:[
Q('Which tissue typically lines the alveoli of the lungs?',['Simple squamous epithelium','Stratified squamous epithelium','Transitional epithelium','Stratified cuboidal epithelium'],0,'Simple squamous epithelium is a thin barrier suited to gas exchange.'),
Q('Which nerve supplies the circumvallate papillae of the tongue?',['Hypoglossal nerve','Glossopharyngeal nerve','Lingual nerve','Chorda tympani'],1,'The glossopharyngeal nerve supplies the posterior third of the tongue, including these papillae.'),
Q('What is the root value of the phrenic nerve?',['C1 to C3','C2 to C4','C3 to C5','C4 to C6'],2,'C3, C4, C5 keep the diaphragm alive.'),
Q('Which artery lies in the anatomical snuffbox?',['Ulnar artery','Radial artery','Brachial artery','Interosseous artery'],1,'The radial artery crosses the floor of the snuffbox.'),
Q('Which nerve roots are involved in Klumpke paralysis?',['C5, C6','C6, C7','C8, T1','T1, T2'],2,'Klumpke paralysis is a lower brachial plexus injury (C8, T1).'),
Q('Which nerve roots are involved in Erb palsy?',['C5, C6','C6, C7','C7, C8, T1','C5 to T1'],0,'Erb palsy is an upper trunk injury (C5, C6).'),
Q('Which rotator cuff muscle is most commonly injured?',['Supraspinatus','Infraspinatus','Teres minor','Subscapularis'],0,'Supraspinatus is most often torn because it passes under the acromion.'),
Q('The common peroneal nerve winds around which bony site?',['Shaft of tibia','Neck of fibula','Lower tibiofibular joint','Medial malleolus'],1,'It is vulnerable at the neck of the fibula.'),
Q('What is the root value of the long thoracic nerve?',['C3, C4, C5','C5, C6, C7','C7, C8, T1','C2, C3, C4'],1,'C5 to C7 supplies serratus anterior; injury causes a winged scapula.'),
Q('Which is the most common type of diaphragmatic hernia in newborns?',['Bochdalek hernia','Morgagni hernia','Paraoesophageal hernia','Hiatus hernia'],0,'Bochdalek hernia occurs through the posterolateral part of the diaphragm.'),
Q('The superior parathyroid glands develop from which pharyngeal pouch?',['1st','2nd','3rd','4th'],3,'Superior parathyroids come from the 4th pouch; inferior ones from the 3rd.'),
Q('Ameloblasts produce which substance?',['Cementum','Dentin','Enamel','Pulp'],2,'Ameloblasts secrete enamel; odontoblasts secrete dentin.'),
Q('Which cells myelinate axons in the CNS?',['Microglia','Astrocytes','Schwann cells','Oligodendrocytes'],3,'Schwann cells myelinate in the PNS; oligodendrocytes do so in the CNS.'),
Q('Ito (stellate) cells are found in which organ?',['Brain','Kidney','Liver','Lung'],2,'Ito cells lie in the perisinusoidal space of the liver and store vitamin A.'),
Q('Which cells contribute to the blood-brain barrier through their end-feet?',['Oligodendrocytes','Microglia','Astrocytes','Schwann cells'],2,'Astrocyte end-feet surround brain capillaries.'),
Q('Which is the longest cranial nerve?',['Optic','Abducent','Trigeminal','Vagus'],3,'The vagus nerve runs from the brainstem down to the abdomen.'),
Q('In spermatogenesis, meiosis I converts which cell into which?',['Primary to secondary spermatocyte','Secondary spermatocyte to spermatid','Spermatogonium to primary spermatocyte','Spermatid to spermatozoon'],0,'The first meiotic division gives two secondary spermatocytes.'),
Q('Implantation of the blastocyst near the internal os causes which condition?',['Placenta accreta','Placenta previa','Placenta percreta','Abruptio placentae'],1,'A low-lying placenta covering the os is placenta previa.'),
Q('Somites develop from which embryonic tissue?',['Notochord','Intermediate mesoderm','Paraxial mesoderm','Lateral plate mesoderm'],2,'Paraxial mesoderm segments into somites.'),
Q('The epithelial lining of the gut tube comes from which germ layer?',['Ectoderm','Mesoderm','Endoderm','Neural crest'],2,'Endoderm forms the lining of the gut tube.'),
Q('The arch of the aorta develops from which aortic arch artery?',['Right 4th','Left 3rd','Left 4th','Right 3rd'],2,'The left 4th arch artery forms part of the aortic arch.'),
Q('The paramesonephric (Mullerian) duct forms which structure?',['Ureter','Uterus','Bladder','Penis'],1,'Paramesonephric ducts form the uterus, tubes and upper vagina.'),
Q('Which nerve carries taste from the anterior two-thirds of the tongue?',['Glossopharyngeal nerve','Hypoglossal nerve','Trigeminal nerve','Chorda tympani'],3,'Chorda tympani, a branch of the facial nerve, carries this taste.'),
Q('What is the order of structures in the intercostal neurovascular bundle, from above downwards?',['Vein, artery, nerve','Artery, nerve, vein','Artery, vein, nerve','Nerve, vein, artery'],0,'Remember VAN: vein, artery, nerve.'),
Q('The azygos vein drains into which vessel?',['Left brachiocephalic vein','Inferior vena cava','Superior vena cava','Right atrium'],2,'The azygos arches over the right lung root into the SVC.'),
Q('Which chamber forms most of the base of the heart?',['Right atrium','Left atrium','Right ventricle','Left ventricle'],1,'The left atrium forms most of the base, facing posteriorly.'),
Q('Where does the left ovarian vein drain?',['Common iliac vein','Left renal vein','Inferior vena cava','Internal iliac vein'],1,'The left drains into the left renal vein; the right drains into the IVC.'),
Q('The ovarian artery is a branch of which vessel?',['Renal artery','Internal iliac artery','Abdominal aorta','External iliac artery'],2,'It arises directly from the abdominal aorta, just below the renal arteries.'),
Q('At which vertebral level does the thoracic duct cross from right to left?',['T12','T9','T5','T2'],2,'It crosses at about T5, behind the oesophagus.'),
Q('What type of joint is the first carpometacarpal joint?',['Pivot','Hinge','Ball and socket','Saddle'],3,'The saddle joint of the thumb allows opposition.'),
Q('The median atlantoaxial joint is which type of joint?',['Hinge','Ball and socket','Pivot','Saddle'],2,'The dens of the axis rotates within the atlas ring: a pivot joint.'),
Q('The anterior cruciate ligament mainly prevents which movement?',['Anterior displacement of the tibia','Posterior displacement of the tibia','Medial rotation of the femur only','Hyperextension of the hip'],0,'ACL stops the tibia sliding forward on the femur.'),
Q('The axillary artery is divided into three parts by which structure?',['First rib','Clavicle','Pectoralis minor','Teres minor'],2,'Pectoralis minor lies over the second part.'),
Q('Which muscle divides the submandibular gland into superficial and deep parts?',['Digastric','Geniohyoid','Mylohyoid','Stylohyoid'],2,'The gland wraps around the posterior border of mylohyoid.'),
Q('Through which foramen does the mandibular nerve leave the skull?',['Foramen rotundum','Foramen lacerum','Stylomastoid foramen','Foramen ovale'],3,'V3 passes through the foramen ovale.'),
Q('The internal jugular vein is a continuation of which sinus?',['Cavernous sinus','Sigmoid sinus','Inferior petrosal sinus','Superior petrosal sinus'],1,'The sigmoid sinus becomes the internal jugular vein at the jugular foramen.'),
Q('The superior thyroid artery is usually a branch of which artery?',['Internal carotid','External carotid','Facial','Maxillary'],1,'It is the first anterior branch of the external carotid.'),
Q('The internal thoracic artery arises from which vessel?',['Common carotid artery','Brachiocephalic trunk','Subclavian artery','External carotid artery'],2,'It arises from the first part of the subclavian artery.'),
Q('How many parathyroid glands are there in most people?',['Four','Three','Two','Five'],0,'Most people have four, two superior and two inferior.'),
Q('Ape thumb deformity is due to damage to which nerve?',['Median nerve','Ulnar nerve','Radial nerve','Axillary nerve'],0,'The median nerve supplies the thenar muscles.'),
Q('Which nerve enters the inguinal canal through the deep inguinal ring?',['Ilioinguinal nerve','Pudendal nerve','Genital branch of genitofemoral nerve','Superior rectal nerve'],2,'The ilioinguinal nerve enters through the anterior wall, not the deep ring.'),
Q('Torus aorticus is an impression seen in which cardiac chamber?',['Right atrium','Left atrium','Right ventricle','Left ventricle'],0,'It is caused by the adjacent aortic sinus bulging into the right atrium.'),
Q('Which chamber forms most of the sternocostal surface of the heart?',['Left atrium','Left ventricle','Right atrium','Right ventricle'],3,'The right ventricle forms most of the anterior surface.'),
Q('Parietal peritoneum is lined by which type of epithelium?',['Simple squamous','Stratified squamous','Cuboidal','Columnar'],0,'It is a mesothelium of simple squamous cells.'),
Q('At which vertebral level does the oesophagus pass through the diaphragm?',['T8','T10','T12','T2'],1,'The oesophageal hiatus is at T10; the aortic hiatus is at T12.'),
Q('The procerus muscle is a continuation of which muscle?',['Occipitofrontalis','Masseter','Medial pterygoid','Temporalis'],0,'Procerus continues from the frontal belly of occipitofrontalis.'),
Q('For thoracocentesis, along which part of the rib should the needle be passed?',['Upper border','Lower border','Centre of the rib','Posterior surface'],0,'The neurovascular bundle runs under the lower border, so use the upper border.'),
Q('Respiratory bronchioles lead into which structure?',['Terminal bronchiole','Main bronchus','Tertiary bronchus','Alveolar duct'],3,'Respiratory bronchioles open into alveolar ducts.'),
Q('Which artery supplies the anal canal above the pectinate line?',['Superior rectal artery','Inferior rectal artery','Middle rectal artery','Internal pudendal artery'],0,'Above the line is supplied by the superior rectal artery; below by the inferior rectal.'),
Q('The organ of Corti lies on which structure?',['Basilar membrane','Utricle','Saccule','Tectorial membrane'],0,'The organ of Corti sits on the basilar membrane of the cochlea.'),
Q('Dorello canal transmits which nerve?',['Mandibular nerve','Middle meningeal nerve','Abducent nerve','Maxillary nerve'],2,'The abducent nerve passes through it near the petrous apex.'),
Q("Which of the following statement(s) is/are FALSE about genitourinary anatomy?",["Superficial dorsal penile artery is a branch of bulbourethral artery", "Penile skin is supplied by superficial external pudendal artery", "Penis receives three venous drainage systems", "There are 5 urethral sphincters in children", "Nerve supply of penis includes pelvic splanchnic nerves"],[0, 3],"Per the source key, statements a and d are the false ones: the superficial dorsal penile artery is not a bulbourethral branch, and children do not have five urethral sphincters."),
Q("4th Aortic arch is responsible for the formation of?",["Arch of aorta", "Pulmonary artery", "Pulmonary vein", "Subclavian artery", "Subclavian vein"],[0, 3],"The left fourth arch forms the arch of the aorta; on the right it forms the proximal right subclavian artery."),
Q("All are true regarding renal anatomy EXCEPT?",["Left kidney is related to both 11th & 12th ribs", "Long axis is lateral and upwards", "Supplied by anterior segmental artery", "Supplied by rectal plexus", "Both kidneys move in opposite direction during respiration"],[1, 3, 4],"The kidney's long axis runs upward and medially, its nerve supply is the renal plexus, and both kidneys move down together on inspiration, so b, d and e are false."),
Q("True statement regarding anatomy of nasolacrimal apparatus is/are?",["Nasolacrimal duct opens in inferior meatus", "There is upper & lower canaliculus", "Most people have common canaliculus", "Canaliculus is lined by Ciliated stratified columnar epithelium", "Nasolacrimal duct is fractured in most head and neck injuries"],[0, 1, 2, 4],"The duct opens into the inferior meatus, there are upper and lower canaliculi that usually join as a common canaliculus, and the duct is often injured in facial trauma (per the source key)."),
Q("Posterior interosseous nerve supplies?",["Extensor carpi radialis longus", "Extensor carpi radialis brevis", "Extensor carpi ulnaris", "Brachioradialis", "Extensor pollicis longus"],[1, 2, 4],"The posterior interosseous nerve supplies ECRB, ECU and extensor pollicis longus; ECRL and brachioradialis are supplied by the radial nerve itself."),
Q("Cavernous sinus receives blood from?",["Superior ophthalmic vein", "Superior petrosal sinus", "Inferior petrosal sinus", "Spheno-parietal sinus", "Basilar plexus of veins"],[0, 3],"The cavernous sinus receives the superior ophthalmic vein and the sphenoparietal sinus; the petrosal sinuses carry blood away from it."),
Q("Inner Waldeyer's ring includes?",["Jugulo-digastric nodes", "Jugulo-omohoid nodes", "Palatine tonsil", "Tubal tonsil", "Pharyngeal tonsil"],[2, 3, 4],"The inner Waldeyer ring is pharyngeal lymphoid tissue: palatine, tubal and pharyngeal tonsils. The jugular nodes belong to the outer ring."),
Q("Structure(s) passing through aortic opening into the chest include?",["Thoracic duct", "Azygous vein", "Hemiazygous vein", "Esophagus", "Inferior vena cava"],[0, 1],"Per the source key, the thoracic duct and azygos vein pass through the aortic opening at T12 along with the aorta."),
Q("Constituents of Rotator cuff includes all EXCEPT?",["Teres major", "Teres minor", "Supraspinatus", "Infraspinatus", "Subscapularis"],[0],"The rotator cuff has four muscles: supraspinatus, infraspinatus, teres minor and subscapularis. Teres major is not part of it."),
Q("Not TRUE statement regarding parotid gland is/are?",["Deep lobe contains deep lymphatics", "Divided into superficial and deep lobes by facial nerve", "Parotid duct opens opposite to the second upper molar", "Ectodermal in origin", "Auriculotemporal nerve is the main sensory nerve"],[0],"Per the source key, statement a is the incorrect one. The parotid is ectodermal, is divided into lobes by the facial nerve, and its duct opens opposite the upper second molar."),
Q("External anal sphincter is innervated by?",["S2,S3,S4", "S2, S3", "S1,S2", "L5,Sl", "L2,L3"],[0],"The external anal sphincter is supplied by the inferior rectal nerve (S2 to S3) and the perineal branch of S4, so the key gives S2, S3, S4."),
Q("A patient had a lesion in the wrist. On examination the thumb was laterally rotated & adducted, with ape thumb deformity. Which is the nerve involved?",["Median", "Ulnar", "Radial", "Post interosseous nerve", "None"],[0],"A median nerve lesion at the wrist weakens the thenar muscles, so the thumb stays adducted and laterally rotated: ape thumb."),
Q("Spring ligament refers to?",["Plantar calcaneonavicular ligament", "Short planter ligament", "Long planter ligament", "Both'b' &'c'", "None"],[0],"The spring ligament is the plantar calcaneonavicular ligament, which supports the head of the talus."),
Q("Which of the following is NOT a content of medial wall of middle ear?",["Oval window", "Round window", "Processus cochleariformis", "Aditus & antrum", "Notch of Rivinus"],[3, 4],"The aditus and antrum are in the posterior wall and the notch of Rivinus is in the lateral wall. The oval window, round window and processus cochleariformis are on the medial wall."),
Q("Pronator quadratus has same innervations as following muscles?",["Flexor pollicis longus", "Flexor digitorum superficialis", "Palmaris longus", "Flexor digitorum profundus of middle finger", "Flexor carpi ulnaris"],[0, 1, 2, 3],"Pronator quadratus is supplied by the anterior interosseous branch of the median nerve, like the other median-supplied muscles listed. Flexor carpi ulnaris is ulnar."),
Q("Supination & pronation doesn't take place at?",["Superior radioulnar joint", "Middle radioulnar joint", "Inferior radioulnar joint", "Radiocarpal joint", "Midcarpal joint"],[3, 4],"Pronation and supination happen at the radioulnar joints. The radiocarpal and midcarpal joints do not take part."),
Q("True regarding red pulp of spleen is/are?",["Periarteriolar lymphoid sheaths", "B-cell containing lymphoid follicles", "Perisinusoidal macrophages", "Composed of sinusoids and splenic cords", "Removal of old RBCs and modification of new cells"],[2, 3, 4],"Red pulp is made of splenic cords and sinusoids with macrophages that remove old red cells. White pulp holds the periarteriolar sheaths and follicles."),
Q("Posterior interosseous nerve supplies all except:",["Extensor carpi radialis longus", "Extensor carpi ulnaris", "Extensor digitorum", "Extensor indices", "Flexor carpi ulnaris"],[0, 4],"ECRL is supplied by the radial nerve before it divides and flexor carpi ulnaris by the ulnar nerve, so neither comes from the posterior interosseous nerve."),
Q("Muscles of anterior compartment of leg is/ are:",["Peroneus tertius", "Peroneus brevis", "Peroneus longus", "Flexor digitorum longus", "Flexor hallucis longus"],[0],"Peroneus tertius lies in the anterior compartment. Peroneus longus and brevis are lateral, and the long flexors are posterior."),
Q("Branches of internal carotid artery directly arising from it:",["Posterior communicating artery", "Superior hypophyseal artery", "Inferior hypophyseal artery", "Posterior cerebral artery", "Recurrent artery of Heubner"],[0, 1, 2],"The posterior communicating, superior hypophyseal and inferior hypophyseal arteries arise directly from the internal carotid. The PCA and recurrent artery of Heubner come from other vessels."),
Q("Correct statement about meiosis:",["Somatic cells not divide by meiosis because number of chromosomes reduces to half", "Occur in germ cell which result in haploid cells", "One spermatocyte produces one sperm and one oocyte produces one ovum", "Germ cell undergoes division to form diploid cell and increase their number", "Body needs meiosis to produce large no. of eggs and sperms"],[0, 1, 4],"Meiosis happens in germ cells and gives haploid gametes. One spermatocyte gives four sperm, so statement c is wrong."),
Q("All are true about vestibular nerve except:",["It has two division- superior and inferior vestibular", "Vestibular nuclei situated at junction of pons and medulla", "Nerve fibres relay at scarpa's ganglion", "Nucleus lies in midbrain near aqueduct", "None"],[3],"The vestibular nuclei lie at the pontomedullary junction, not in the midbrain. The nerve has superior and inferior divisions and a ganglion called Scarpa ganglion."),

document.querySelectorAll('#subjects button').forEach(b=>b.addEventListener('click',()=>start(b.dataset.k)));
function start(k){key=k;set=shuffle(bank[k].list).slice(0,ROUND);i=0;score=0;$('#picker').style.display='none';$('#quizBox').style.display='block';$('#subjectName').textContent=bank[k].label;show();window.scrollTo({top:0,behavior:'smooth'})}
function show(){const x=set[i];done=false;sel=[];multi=Array.isArray(x.correct);$('#count').textContent='Question '+(i+1)+' of '+set.length+' · Score '+score;$('#bar').style.width=(i/set.length*100)+'%';$('#question').textContent=x.q+(multi?' (select all that apply)':'');$('#feedback').textContent=multi?'Select all correct options, then tap Check answer.':'Select one option.';$('#exp').hidden=true;$('#showExp').style.display='none';$('#showExp').textContent='Show explanation';$('#check').style.display=multi?'inline-block':'none';$('#check').disabled=true;$('#next').disabled=true;$('#next').textContent=i===set.length-1?'See result →':'Next →';$('#answers').innerHTML=x.a.map((a,n)=>'<button class="answer" data-n="'+n+'">'+a+'</button>').join('');document.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>multi?tog(+b.dataset.n,b):grade(+b.dataset.n===x.correct,[+b.dataset.n],[x.correct])))}
function tog(n,b){if(done)return;const k=sel.indexOf(n);if(k>-1){sel.splice(k,1);b.classList.remove('picked')}else{sel.push(n);b.classList.add('picked')}$('#check').disabled=!sel.length}
$('#check').addEventListener('click',()=>{if(done||!multi)return;const c=set[i].correct;grade(sel.length===c.length&&c.every(v=>sel.includes(v)),sel,c)});
function grade(ok,chosen,cor){if(done)return;done=true;const x=set[i];document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;b.classList.remove('picked');if(cor.includes(j))b.classList.add('correct');else if(chosen.includes(j))b.classList.add('wrong')});if(ok)score++;$('#feedback').textContent=ok?'Correct!':(multi?'Not quite. Green shows the correct options.':'Not quite.');$('#exp').textContent='Correct answer'+(cor.length>1?'s':'')+': '+cor.map(j=>'abcde'[j]+') '+x.a[j]).join('; ')+'. '+x.why;$('#exp').hidden=true;$('#showExp').style.display='inline-block';$('#check').style.display='none';$('#count').textContent='Question '+(i+1)+' of '+set.length+' · Score '+score;$('#next').disabled=false}
$('#showExp').addEventListener('click',()=>{const e=$('#exp');e.hidden=!e.hidden;$('#showExp').textContent=e.hidden?'Show explanation':'Hide explanation'});
$('#next').addEventListener('click',()=>{if(!done)return;if(i<set.length-1){i++;show();return}$('#bar').style.width='100%';$('#exp').hidden=true;$('#showExp').style.display='none';$('#check').style.display='none';$('#question').textContent='You scored '+score+' out of '+set.length;$('#answers').innerHTML='';const p=score/set.length;$('#feedback').textContent=p===1?'Excellent work!':p>=0.6?'Good effort! Review the explanations and try again.':'Keep practising. Revise the notes and retry.';$('#next').textContent='New round ↻';$('#next').disabled=false;$('#next').onclick=()=>{$('#next').onclick=null;start(key)}});
$('#change').addEventListener('click',()=>{$('#next').onclick=null;$('#quizBox').style.display='none';$('#picker').style.display='block'});
</script></body></html>
